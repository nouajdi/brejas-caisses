version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: breja
      POSTGRES_PASSWORD: brejapass
      POSTGRES_DB: brejas_caisses
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://breja:brejapass@postgres:5432/brejas_caisses
      JWT_SECRET: dev-secret
      PORT: 3000
    depends_on:
      - postgres
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    ports:
      - '3001:3001'
    environment:
      VITE_API_URL: http://localhost:3000
    command: npm run dev

volumes:
  postgres_data:
